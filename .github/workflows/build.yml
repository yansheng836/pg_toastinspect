name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pg-version: [14, 15, 16, 17]

    steps:
    - uses: actions/checkout@v4

    - name: Build and test in PostgreSQL container
      run: |
        # Create a temporary directory for our work
        TEMP_DIR=$(mktemp -d)

        # Copy our extension files to the temporary directory
        cp -r . "$TEMP_DIR/"

        # Run PostgreSQL container and build/test extension inside
        docker run --rm -d \
          --name pg_toastinspect_test \
          -e POSTGRES_PASSWORD=postgres \
          -v "$TEMP_DIR":/pg_toastinspect \
          postgres:${{ matrix.pg-version }}

        # Wait for PostgreSQL to be ready
        echo "Waiting for PostgreSQL to be ready..."
        for i in {1..30}; do
          if docker exec pg_toastinspect_test pg_isready -U postgres; then
            echo "PostgreSQL is ready!"
            break
          fi
          echo "PostgreSQL not ready yet... waiting 1 second"
          sleep 1
        done

        # Install build dependencies
        echo "Installing build dependencies..."
        docker exec pg_toastinspect_test apt-get update
        docker exec pg_toastinspect_test apt-get install -y build-essential git

        # Build the extension
        echo "Building extension..."
        docker exec pg_toastinspect_test bash -c "cd /pg_toastinspect && make clean && make"

        # Install the extension
        echo "Installing extension..."
        docker exec pg_toastinspect_test bash -c "cd /pg_toastinspect && make install"

        # Create test user and database
        echo "Creating test user and database..."
        docker exec pg_toastinspect_test psql -U postgres -c "CREATE USER testuser WITH SUPERUSER PASSWORD 'testpass';"
        docker exec pg_toastinspect_test createdb -U postgres -O testuser testdb

        # Test extension installation
        echo "Testing extension installation..."
        docker exec pg_toastinspect_test psql -U testuser -d testdb -h localhost -c "CREATE EXTENSION pg_toastinspect;"

        # Run basic tests
        echo "Running basic tests..."
        docker exec pg_toastinspect_test psql -U testuser -d testdb -h localhost -f /pg_toastinspect/test.sql || true

        # Test with text data type
        echo "Testing with text..."
        docker exec pg_toastinspect_test psql -U testuser -d testdb -h localhost -c "
          CREATE TABLE test_table (id int, large_text text);
          INSERT INTO test_table VALUES (1, repeat('a', 10000));
          SELECT get_toast_chunk_id(large_text), get_toast_info(large_text) FROM test_table;
        "

        # Test with bytea data type
        echo "Testing with bytea..."
        docker exec pg_toastinspect_test psql -U testuser -d testdb -h localhost -c "
          CREATE TABLE test_table2 (id int, large_bytea bytea);
          INSERT INTO test_table2 VALUES (1, decode(repeat('00ff', 5000), 'hex'));
          SELECT get_toast_chunk_id(large_bytea), get_toast_info(large_bytea) FROM test_table2;
        "

        # Test with jsonb data type
        echo "Testing with jsonb..."
        docker exec pg_toastinspect_test psql -U testuser -d testdb -h localhost -c "
          CREATE TABLE test_table3 (id int, large_jsonb jsonb);
          INSERT INTO test_table3 VALUES (1, jsonb_build_object('data', repeat('x', 10000)));
          SELECT get_toast_chunk_id(large_jsonb), get_toast_info(large_jsonb) FROM test_table3;
        "

        # Stop and remove the container
        echo "Cleaning up..."
        docker stop pg_toastinspect_test

        # Cleanup temporary directory
        rm -rf "$TEMP_DIR"

        echo "All tests completed successfully!"