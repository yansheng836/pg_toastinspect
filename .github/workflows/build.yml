name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pg-version: [14, 15, 16, 17]

    steps:
    - uses: actions/checkout@v4

    - name: Set up PostgreSQL repository and install packages
      run: |
        # Add PostgreSQL repository
        sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
        wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
        sudo apt-get update

        # Install PostgreSQL server and development packages
        sudo apt-get install -y \
          postgresql-${{ matrix.pg-version }} \
          postgresql-server-dev-${{ matrix.pg-version }} \
          libpq-dev

        # Start PostgreSQL server
        sudo systemctl start postgresql@${{ matrix.pg-version }}-main

    - name: Build extension
      run: |
        make clean
        make

    - name: Install extension
      run: |
        sudo make install

    - name: Set up test database and user
      run: |
        # Switch to postgres user and create test user/database
        sudo -u postgres psql -c "CREATE USER testuser WITH SUPERUSER PASSWORD 'testpass';"
        sudo -u postgres createdb -O testuser testdb

    - name: Test extension installation
      run: |
        PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -c "CREATE EXTENSION pg_toastinspect;"

    - name: Run basic tests
      run: |
        PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -f test.sql || true

    - name: Test with text
      run: |
        PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -c "
          CREATE TABLE test_table (id int, large_text text);
          INSERT INTO test_table VALUES (1, repeat('a', 10000));
          SELECT get_toast_chunk_id(large_text), get_toast_info(large_text) FROM test_table;
        "

    - name: Test with bytea
      run: |
        PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -c "
          CREATE TABLE test_table2 (id int, large_bytea bytea);
          INSERT INTO test_table2 VALUES (1, decode(repeat('00ff', 5000), 'hex'));
          SELECT get_toast_chunk_id(large_bytea), get_toast_info(large_bytea) FROM test_table2;
        "

    - name: Test with jsonb
      run: |
        PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -c "
          CREATE TABLE test_table3 (id int, large_jsonb jsonb);
          INSERT INTO test_table3 VALUES (1, jsonb_build_object('data', repeat('x', 10000)));
          SELECT get_toast_chunk_id(large_jsonb), get_toast_info(large_jsonb) FROM test_table3;
        "